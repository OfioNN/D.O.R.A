<tspan x="445" y="237.4">Nasłuch:</tspan>
<tspan x="445" y="261.8">mikrofon + VAD</tspan>
</text>
<text x="445" y="287.2" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" font-style="italic" font-weight="700" fill="#6A3FB0">▸ „Słucham…”</text>
