<tspan x="1045" y="261.8">mowę na tekst</tspan>
</text>
<text x="1045" y="287.2" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" font-style="italic" font-weight="700" fill="#6A3FB0">▸ „Rozpoznaję mowę…”</text>
<polygon points="1345,165.0 1465.0,255 1345,345.0 1225.0,255" fill="#BDE5AE" stroke="#3a3a3a" stroke-width="2.2" filter="url(#sh)"/>
