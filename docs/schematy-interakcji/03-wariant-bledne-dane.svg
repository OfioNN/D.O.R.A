<tspan x="1645" y="225.20000000000002">Licznik prób = 0;</tspan>
<tspan x="1645" y="249.60000000000002">RAG przeszukuje</tspan>
<tspan x="1645" y="274.0">projekty</tspan>
</text>
<text x="1645" y="299.4" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" font-style="italic" font-weight="700" fill="#6A3FB0">▸ „Szukam w projektach…”</text>
